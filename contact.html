<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fernhill Coffee — Contact</title>
  <link rel="stylesheet" href="style.css">
  <script src="analytics.js"></script>
</head>
<body>
  <header><div class="wrap">
    <a class="logo" href="index.html">☕ Fernhill Coffee</a>
    <nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html" class="active">Contact</a></nav>
  </div></header>

  <main class="wrap">
    <div class="hero">
      <h1>Get in touch</h1>
      <p>Submitting this form sends a <code>generate_lead</code> event. Only the topic is sent to GA — never names or emails.</p>
    </div>

    <section>
      <form id="contact" data-form-event="generate_lead">
        <label>Name <input name="name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>Topic
          <select name="topic">
            <option value="wholesale">Wholesale</option>
            <option value="subscription">Subscription</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label>Message <textarea name="message" rows="4"></textarea></label>
        <button class="btn" type="submit">Send</button>
        <p class="form-ok" hidden>Message sent! (generate_lead event sent)</p>
      </form>
    </section>
  </main>

  <footer><div class="wrap">Fernhill Coffee is a fictional store. GA Measurement ID: <code id="ga-id"></code></div></footer>

  <aside id="event-log"><header><span>Events sent</span><span>GA4</span></header><ul id="event-log-list"></ul></aside>
</body>
</html>
